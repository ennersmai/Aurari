<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Launcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .status {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 30px;
            min-height: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .progress-container {
            width: 280px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            width: 0%;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">Aura</div>
        <div class="status" id="status">Initializing...</div>
        <div class="spinner"></div>
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
    </div>
    <script>
        const { listen } = window.__TAURI__.event;
        
        let progress = 0;
        const progressBar = document.getElementById('progress');
        const statusEl = document.getElementById('status');
        
        // Simulate progress
        const progressInterval = setInterval(() => {
            if (progress < 90) {
                progress += Math.random() * 5;
                progressBar.style.width = Math.min(progress, 90) + '%';
            }
        }, 500);
        
        // Listen for status updates from Rust
        listen('status-update', (event) => {
            statusEl.textContent = event.payload;
            
            // Map status to progress
            if (event.payload.includes('Docker')) {
                progress = 20;
            } else if (event.payload.includes('TTS')) {
                progress = 40;
            } else if (event.payload.includes('containers')) {
                progress = 60;
            } else if (event.payload.includes('Waiting')) {
                progress = 80;
            } else if (event.payload.includes('Ready')) {
                progress = 100;
                clearInterval(progressInterval);
                progressBar.style.width = '100%';
            } else if (event.payload.includes('Error')) {
                clearInterval(progressInterval);
                progressBar.style.background = '#ef4444';
            }
            
            progressBar.style.width = progress + '%';
        });
    </script>
</body>
</html>
