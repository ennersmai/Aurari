[package]
name = "aura-launcher"
version = "0.1.0"
edition = "2021"
description = "Native Windows launcher for Aura"
authors = ["Mai", "Claude (head agent)"]
license = "Proprietary"
default-run = "aura-launcher"
rust-version = "1.77"

[lib]
name = "aura_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "aura-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

anyhow = "1"
thiserror = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

tokio = { version = "1", features = [
    "macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util", "net",
] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

dunce = "1"
parking_lot = "0.12"
which = "7"
tauri-plugin-single-instance = "2.0.0-rc.5"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
